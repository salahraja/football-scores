# The football API (api/v1) and the league pages, published to GitHub Pages. Run by hand only (Actions > Run workflow).
# It was set to run every two hours. Its first scheduled run failed (2026-11-17, the day it reached main), because Pages was never
# switched on for the repository (Settings > Pages > Source: GitHub Actions). The reason it was written no longer holds either: it
# assumed the host allowed about 20 deploys a month, but the plan is 300 build minutes (about 330 builds), and refresh.yml now
# rebuilds the site itself when results change. The app asks this address first and falls back to the site, so nothing reads it today.
# To use Pages after all: switch it on, then put the schedule back (cron "11 */2 * * *").
# Address once live: https://salahraja.github.io/football-scores/api/v1/today.json
name: Football API on Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # ESPN's games are fetched once each and kept between runs (scripts/api/fetch-espn.mjs), so each run asks only for new ones
      - uses: actions/cache@v4
        with:
          path: data/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      # openfootball and Wikipedia; a failed fetch keeps the committed copy, so a source outage never publishes an empty API
      - run: npm run api
      - name: Say which leagues are late (does not stop the publish)
        run: node scripts/api/check-fresh.mjs || echo "::warning::some league results are more than three days late"
      - run: |
          mkdir -p _site
          cp -R public/api _site/api
          cp -R public/leagues _site/leagues
          date -u +%Y-%m-%dT%H:%M:%SZ > _site/built.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
