# The football API (api/v1) and the league pages, rebuilt every two hours and published to GitHub Pages.
# Why Pages and not Netlify: a Netlify deploy per refresh would use up the free credit in days (about 20 deploys a month); Pages is free
# for a public repo and serves the same static files with `Access-Control-Allow-Origin: *`, so the app and the site can both read it.
# One-time setup (Salah): Settings > Pages > Source: GitHub Actions. Until then the deploy step fails and says so.
# Address once live: https://salahraja.github.io/football-scores/api/v1/today.json
name: Football API on Pages
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
# Read-only by default; only the deploy job, which runs no third-party code, may publish (2026-11-27, from the Atlas sweep on GitHub
# Actions hardening: the build job runs npm ci and npm run api, so it must not hold the Pages and OIDC tokens).
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # ESPN's games are fetched once each and kept between runs (scripts/api/fetch-espn.mjs), so each run asks only for new ones
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      # openfootball and Wikipedia; a failed fetch keeps the committed copy, so a source outage never publishes an empty API
      - run: npm run api
      - name: Say which leagues are late (does not stop the publish)
        run: node scripts/api/check-fresh.mjs || echo "::warning::some league results are more than three days late"
      - run: |
          mkdir -p _site
          cp -R public/api _site/api
          cp -R public/leagues _site/leagues
          date -u +%Y-%m-%dT%H:%M:%SZ > _site/built.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
