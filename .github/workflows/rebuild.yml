# The site is static: results, tables and the API only change when it is rebuilt. This rebuilds it six times a day, so nothing waits for a code change.
# NETLIFY_BUILD_HOOK is a repository secret. Without it this job fails (it used to pass silently, and the data sat for days, 2026-11-08). Six builds a day stay inside Netlify's free build minutes.
name: Rebuild the site
on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "$HOOK" ]; then echo "::error::NETLIFY_BUILD_HOOK is not set, so the site was not rebuilt"; exit 1; fi
          curl -fsS -X POST -d '{}' "$HOOK" >/dev/null
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
