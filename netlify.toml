# Netlify build. Set FOOTBALL_DATA_TOKEN in the site's environment variables (a football-data.org API token).
# Without it the build still works and publishes the committed snapshot in data/raw.
[build]
  # fetch (needs the token, keeps the snapshot if it fails) -> Goose via the committed wasm (empty environment)
  # -> the football API and the league pages (openfootball + Wikipedia; a failed fetch keeps the saved copy, a failed build
  #    writes nothing, and neither stops the site build) -> Vite, which copies public/api and public/leagues into dist
  command = "node scripts/fetch-data.mjs && npm run data && (npm run api || echo 'api build skipped') && VITE_DATA=generated npm run build"
  publish = "dist"

[build.environment]
  # wasm64 (memory64) runs by default from Node 22.23 and 24; 22.18 and older fail. See README.
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content-Security-Policy is written at build time to dist/_headers by scripts/csp.mjs (it allows the build's inline scripts by hash)
